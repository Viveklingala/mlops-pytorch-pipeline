# PersistentVolumeClaims for the dataset cache and model checkpoints,
# followed by the training Job itself. Applying this file creates both.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoints-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-training
  namespace: ml-training
  labels:
    app: mlops-pytorch-pipeline
    component: training
spec:
  backoffLimit: 2
  # Training either finishes or fails outright; retrying via a fresh pod
  # (not an in-place container restart) keeps each attempt's logs clean.
  template:
    metadata:
      labels:
        app: mlops-pytorch-pipeline
        component: training
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /app/configs/training_config.yaml
            - name: CHECKPOINT_DIR
              value: /app/checkpoints
            # Local-cluster demo convenience: caps batches/epoch so the Job
            # finishes in minutes on a CPU-only Minikube node instead of
            # running full epochs. Remove this env var for a real training
            # run on a properly resourced (ideally GPU) cluster.
            - name: MAX_BATCHES
              value: "5"
          resources:
            # NOTE: the assignment spec calls for CPU:2 / Memory:4Gi. On a
            # resource-constrained local Minikube node (e.g. an 8GB laptop,
            # where Docker Desktop's WSL2 VM only gets ~half the host RAM),
            # a 4Gi request can exceed total node-allocatable memory and the
            # pod will sit in Pending forever. Sized down to 2Gi here to fit
            # a small local cluster; bump back to 4Gi for a real/cloud node
            # with enough allocatable memory. CPU stays at the full spec
            # value since CPU was never the constraint.
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
            # --- Bonus: GPU nodes ---
            # Uncomment to schedule onto a GPU node pool. Requires a
            # matching nodeSelector/toleration below and the NVIDIA device
            # plugin installed on the cluster.
            # requests:
            #   nvidia.com/gpu: 1
            # limits:
            #   nvidia.com/gpu: 1
          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/checkpoints
      # --- Bonus: GPU nodes ---
      # nodeSelector:
      #   nvidia.com/gpu.present: "true"
      # tolerations:
      #   - key: nvidia.com/gpu
      #     operator: Exists
      #     effect: NoSchedule
      volumes:
        - name: training-config
          configMap:
            name: training-config
        - name: data
          persistentVolumeClaim:
            claimName: training-data-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoints-pvc
