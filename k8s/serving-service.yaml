# ClusterIP is right for kubectl port-forward / in-cluster testing (Minikube,
# kind). Switch `type` to LoadBalancer on a cloud-managed cluster to get an
# external IP instead.
apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: mlops-pytorch-pipeline
    component: serving
spec:
  type: ClusterIP
  selector:
    app: mlops-pytorch-pipeline
    component: serving
  ports:
    - name: http
      port: 80
      targetPort: 8080
