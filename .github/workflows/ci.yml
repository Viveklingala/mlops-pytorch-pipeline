name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # No pip caching here: our install step below uses
          # `--no-cache-dir` (to keep runner disk usage down for the large
          # torch wheel), which means pip never creates a cache directory —
          # combining that with `cache: "pip"` makes the action's post-job
          # cache-save step fail trying to save a folder that never existed.

      - name: Install training + test dependencies
        run: |
          pip install --no-cache-dir -r requirements/train.txt
          pip install --no-cache-dir pytest ruff==0.15.11

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run unit tests
        run: pytest tests -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build training image
        run: docker build -f docker/Dockerfile.train -t mlops-train:ci .

      - name: Build serving image
        run: docker build -f docker/Dockerfile.serve -t mlops-serve:ci .
